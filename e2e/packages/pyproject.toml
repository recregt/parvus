[project]
name = "parvus-packages"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["periplu>=0.1.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "-rfE"]
periplu_project = "parvus-packages"
periplu_baseline = "resources.json"
periplu_failures = "failures"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PT", "SIM", "RUF", "PL", "PERF"]

[tool.ruff.lint.per-file-ignores]
"machine.py" = ["E501"]
