version: "2"

run:
  tests: true
  build-tags:
    - postgres

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - mnd
    - nolintlint
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        dependencies:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/recregt/parvus
            - github.com/go-webauthn/webauthn
            - github.com/jackc/pgx/v5
            - modernc.org/sqlite
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: (_test\.go|^internal/softauth/|^internal/store/contract/)
        linters:
          - gosec
          - mnd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/recregt/parvus
