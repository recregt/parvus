<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parvus example</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    main { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    label, button { margin-right: 0.5rem; }
    pre { padding: 1rem; overflow-x: auto; background: color-mix(in srgb, currentColor 8%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>Parvus example</h1>
    <p>
      <label>Username <input id="username" autocomplete="username"></label>
    </p>
    <p>
      <button id="register">Register</button>
      <button id="login">Sign in</button>
      <button id="logout">Sign out</button>
    </p>
    <pre id="output"></pre>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
