name: Fuzz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.store }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.store }}-

      - name: Fuzz
        run: nix run .#fuzz -- ${{ matrix.store }} -fuzztime 270m

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.store }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.store }}
          path: fuzz-failures/
          if-no-files-found: ignore
