version: 2
project_name: parvus

builds:
  - id: parvus
    main: ./cmd/parvus
    binary: parvus
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: packages
    package_name: parvus
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}"
    vendor: recregt
    homepage: https://parvus.recregt.com
    maintainer: recregt <203110092+recregt@users.noreply.github.com>
    description: Passkey sign-in for any backend, in one small binary.
    license: MPL-2.0
    section: net
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/parvus.service
        dst: /usr/lib/systemd/system/parvus.service
        packager: deb
      - src: packaging/parvus.service
        dst: /usr/lib/systemd/system/parvus.service
        packager: rpm
      - dst: /etc/parvus
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: parvus
      - src: packaging/parvus.openrc
        dst: /etc/init.d/parvus
        packager: apk
        file_info:
          mode: 0755
      - src: packaging/parvus.env
        dst: /etc/parvus/parvus.env
        type: config|noreplace
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/preinstall.sh
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
    apk:
      scripts:
        postupgrade: packaging/postinstall.sh

homebrew_casks:
  - name: parvus
    repository:
      owner: recregt
      name: homebrew-tap
      git:
        url: git@github.com:recregt/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}'
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_DEPLOY_KEY") "" }}true{{ end }}'
    directory: Casks
    homepage: https://parvus.recregt.com
    description: Passkey sign-in for any backend, in one small binary
    license: MPL-2.0
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/parvus"]
          end

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

dockers_v2:
  - images:
      - ghcr.io/recregt/parvus
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/recregt/parvus
      org.opencontainers.image.documentation: https://parvus.recregt.com
      org.opencontainers.image.licenses: MPL-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.description: Passkey sign-in for any backend, in one small binary.

release:
  github:
    owner: recregt
    name: parvus
